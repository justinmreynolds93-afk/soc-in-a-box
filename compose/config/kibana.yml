# Kibana config mounted into the container. Elasticsearch connection, TLS, and
# encryption keys come from environment variables in docker-compose.yml; this
# file carries the Fleet preconfiguration that must exist before Fleet Server
# can start and enroll agents.
server.host: "0.0.0.0"
server.publicBaseUrl: "https://localhost:5601"

telemetry.optIn: false

# Where Fleet-managed agents ship data. host.docker.internal:9200 resolves from
# BOTH the containers (Docker Desktop injects it) and the Docker host, so one
# output serves the container victims and a host agent (the Windows victim = this
# machine). Per-policy outputs need Platinum, so this is the single default.
# TLS verification is off: the lab cert has no SAN for host.docker.internal.
xpack.fleet.outputs:
  - name: default
    id: fleet-default-output
    type: elasticsearch
    hosts: ["https://host.docker.internal:9200"]
    is_default: true
    is_default_monitoring: true
    ssl:
      verification_mode: none

# Fleet Server is reachable from containers as fleet-server:8220 and from the
# Docker host as host.docker.internal:8220.
xpack.fleet.agents.fleet_server.hosts:
  - "https://fleet-server:8220"
  - "https://host.docker.internal:8220"

xpack.fleet.packages:
  - name: fleet_server
    version: latest
  - name: system
    version: latest
  - name: elastic_agent
    version: latest
  - name: windows
    version: latest
  - name: network_traffic
    version: latest

xpack.fleet.agentPolicies:
  - name: Fleet Server Policy
    id: fleet-server-policy
    namespace: default
    is_managed: false
    monitoring_enabled:
      - logs
      - metrics
    package_policies:
      - name: fleet_server-1
        package:
          name: fleet_server
        inputs:
          - type: fleet-server
            keep_enabled: true
            vars:
              - name: host
                value: 0.0.0.0
                frozen: true
              - name: port
                value: 8220
                frozen: true

  - name: Linux Victim Policy
    id: linux-victim-policy
    namespace: default
    monitoring_enabled:
      - logs
      - metrics
    package_policies:
      - name: system-linux
        package:
          name: system
      - name: network-traffic-linux
        package:
          name: network_traffic

  - name: Windows Victim Policy
    id: windows-victim-policy
    namespace: default
    monitoring_enabled:
      - logs
      - metrics
    package_policies:
      - name: system-windows
        package:
          name: system
      - name: windows-events
        package:
          name: windows
