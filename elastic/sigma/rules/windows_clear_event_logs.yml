title: Windows Event Log Cleared
id: 3c4d5e6f-7a8b-9c0d-1e2f-3a4b5c6d7e8f
status: experimental
description: Security or System event log cleared (1102 / 104) or via wevtutil.
author: SOC-in-a-Box
date: 2026/09/03
references:
  - https://attack.mitre.org/techniques/T1070/001/
logsource:
  product: windows
  service: security
detection:
  selection_event:
    EventID:
      - 1102
      - 104
  selection_tool:
    Image|endswith: '\wevtutil.exe'
    CommandLine|contains:
      - ' cl '
      - ' clear-log '
  condition: selection_event or selection_tool
falsepositives:
  - Rare, communicated admin maintenance
level: high
tags:
  - attack.defense_evasion
  - attack.t1070.001
