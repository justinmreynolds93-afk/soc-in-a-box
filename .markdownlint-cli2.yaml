# markdownlint config — lenient, doc-friendly
config:
  MD013: false   # line length
  MD033: false   # inline HTML (badges, <br/> in mermaid, <!-- comments -->)
  MD041: false   # first line in file must be a top-level heading
  MD024:
    siblings_only: true   # allow repeated headings under different parents
globs:
  - "**/*.md"
ignores:
  - "**/node_modules/**"
  - ".venv/**"
